name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Repository self-check
        run: node scripts/check.js
      - name: Simulator tests
        run: node --test simulator/index.test.js
